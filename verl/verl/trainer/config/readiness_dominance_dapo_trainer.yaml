defaults:
  - ppo_trainer
  - _self_

data:
  max_response_length: 4096

algorithm:
  adv_estimator: grpo

  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: true
    metric: acc
    max_num_gen_batches: 0

  probe_credit:
    enable: false
    coef: 0.0

  readiness_dominance:
    _target_: verl.trainer.config.ReadinessDominanceConfig

    mode: "off"
    absolute_horizons: [256, 512, 1024, 2048]

    n: 4
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    max_tokens: 32
    stop: ["\n"]
    answer_prefix: "\n\nAnswer:"
    strict: true
    strict_branch_margin: 1
    min_common_positions: 2
    max_concurrent_requests: 128
    request_batch_size: 512

actor_rollout_ref:
  actor:
    loss_agg_mode: token-mean
  rollout:
    name: vllm
